<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MyTicket — Mobile Banking Edition</title>

<!-- Tus enlaces de configuración y recursos nativos -->
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./logo-192.png">
<link rel="manifest" href="./manifest.json">

<style>
:root{
  --bg:#07090E; --card:#121824; --card-glass:rgba(18, 24, 36, 0.75); --border:rgba(255,255,255,0.08);
  --primary:#2563EB; --primary-glow:rgba(37,99,235,0.3); --accent:#38BDF8;
  --green:#10B981; --green-glow:rgba(16,185,129,0.2);
  --orange:#F59E0B; --red:#EF4444; --purple:#8B5CF6; --gray:#64748B;
  --text:#F8FAFC; --muted:#94A3B8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; background:#000; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; justify-content:center; align-items:flex-start; min-height:100dvh; overflow-x:hidden;
}
/* Contenedor estricto para simular la pantalla del móvil en cualquier dispositivo */
#app{
  width:100%; max-width:480px; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; padding-bottom:90px; position:relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

/* Pantallas y Animaciones */
.screen{flex:1;display:flex;flex-direction:column;padding:20px 16px;animation:fadeIn .3s cubic-bezier(0.16, 1, 0.3, 1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Barra Superior Tipo App de Banco */
.bank-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px;position:sticky;top:0;background:var(--bg);z-index:10;backdrop-filter:blur(10px);}
.user-info{display:flex;align-items:center;gap:12px;}
.user-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;box-shadow:0 4px 12px var(--primary-glow);}
.user-text .greeting{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.user-text .name{font-size:16px;font-weight:700;}
.header-actions{display:flex;gap:8px;}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:transform .15s;}
.icon-btn:active{transform:scale(0.92);}

/* Tarjeta Principal Dinero Disponible (Estilo Neobanco) */
.balance-card{background:linear-gradient(135deg, #1E3A8A 0%, #111827 100%);border:1px solid rgba(59,130,246,0.3);border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 12px 32px rgba(0,0,0,0.4);position:relative;overflow:hidden;}
.balance-card::before{content:"";position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);border-radius:50%;pointer-events:none;}
.card-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.card-chip{width:36px;height:26px;background:linear-gradient(135deg, #FDE047, #CA8A04);border-radius:5px;position:relative;}
.card-chip::after{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,0.3);border-radius:2px;}
.hide-toggle{background:rgba(255,255,255,0.1);border:none;color:var(--text);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;}
.balance-label{font-size:13px;color:var(--muted);margin-bottom:4px;}
.balance-amount{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:12px;}
.balance-details{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;}
.balance-details b{color:var(--text);}

/* Tarjetas y Contenedores */
.card{background:var(--card-glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700;}
.card p.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5;}

/* Alertas e Insights */
.insight{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:14px;padding:14px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.alert-card{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px);}
.alert-card .emoji{font-size:24px;line-height:1;}
.alert-card .t{font-size:14px;font-weight:700;margin-bottom:2px;}
.alert-card .m{font-size:12px;color:var(--muted);line-height:1.4;}

/* Botones Modernos */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;cursor:pointer;border-radius:16px;padding:16px 20px;font-size:16px;font-weight:700;color:#fff;background:var(--primary);margin-bottom:10px;min-height:54px;box-shadow:0 4px 16px var(--primary-glow);transition:transform .1s, opacity .1s;}
.btn:active{transform:scale(0.97);opacity:0.9;}
.btn.small{padding:10px 14px;font-size:13px;border-radius:12px;min-height:40px;width:auto;}
.btn.secondary{background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid var(--border);}
.btn.green{background:var(--green);box-shadow:0 4px 16px var(--green-glow);}
.btn.purple{background:var(--purple);box-shadow:0 4px 16px rgba(139,92,246,0.3);}
.btn.outline{background:transparent;border:2px solid var(--red);color:var(--red);box-shadow:none;}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;box-shadow:none;}

/* Navegación Inferior (Bottom Nav Bar tipo Banco) */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(18, 24, 36, 0.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:50;}
.nav-item{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;cursor:pointer;flex:1;padding:6px;transition:color .2s;}
.nav-item span.icon{font-size:20px;}
.nav-item.active{color:var(--accent);}
.scan-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));border:none;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--primary-glow);cursor:pointer;margin-top:-20px;transition:transform .15s;}
.scan-fab:active{transform:scale(0.9);}

/* Inputs y Formularios */
.input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:14px;font-size:16px;margin-bottom:12px;outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,0.15);}
textarea.input{resize:vertical;min-height:80px;}
label.lbl{font-size:12px;color:var(--muted);display:block;margin:0 0 6px 4px;font-weight:600;}
select.input{appearance:none;}

/* Utilidades y Rejillas */
.row{display:flex;gap:10px;width:100%;}.row.between{justify-content:space-between;align-items:center;}.row.wrap{flex-wrap:wrap;}
.mini-grid{display:flex;gap:10px;width:100%;margin-bottom:14px;}
.mini{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 10px;text-align:center;}
.mini .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.mini .v{font-size:16px;font-weight:800;margin-top:4px;}
.pbar-wrap{background:rgba(255,255,255,0.08);border-radius:8px;height:10px;overflow:hidden;display:flex;width:100%;}
.pbar-wrap.h14{height:14px;border-radius:7px;}
.pbar-spent{background:var(--red);height:100%;border-radius:8px 0 0 8px;}
.pbar-rest{background:var(--green);height:100%;}
.pbar-ess{background:var(--green);height:100%;border-radius:8px 0 0 8px;}
.pbar-fug{background:var(--orange);height:100%;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;}
.chart-title{font-size:14px;font-weight:700;margin-bottom:14px;}
.bars{display:flex;justify-content:space-around;align-items:flex-end;height:120px;gap:8px;}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;}
.bar-stack{display:flex;flex-direction:column;justify-content:flex-end;width:24px;border-radius:6px;overflow:hidden;}
.bar-ess{background:var(--green);width:100%;} .bar-fug{background:var(--orange);width:100%;}
.bar-lbl{font-size:10px;color:var(--muted);margin-top:6px;}
.legend{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:4px;}
.legend .sw{width:8px;height:8px;border-radius:2px;display:inline-block;}

/* Transacciones y Listas */
.tx-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;transition:transform .1s;}
.tx-item:active{transform:scale(0.99);}
.tx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tx-name{font-weight:700;font-size:15px;} .tx-amt{font-weight:800;color:var(--accent);white-space:nowrap;}
.tx-date{font-size:12px;color:var(--muted);margin:3px 0 8px;}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;margin-right:6px;font-weight:600;}
.chip.ess{background:rgba(16,185,129,0.15);color:var(--green);} .chip.fug{background:rgba(245,158,11,0.15);color:var(--orange);}
.item-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;}
.item-row .ic{font-size:18px;} .item-row .nm{flex:1;} .item-row .nm .n{font-size:14px;font-weight:600;}
.item-row .nm .e{font-size:11px;color:var(--muted);} .item-row .pr{font-weight:800;font-size:15px;}

/* Onboarding y Modales */
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
.dot{width:32px;height:5px;border-radius:3px;background:var(--border);transition:background .3s;}
.dot.done{background:var(--green);} .dot.cur{background:var(--accent);}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;color:var(--text);transition:all .2s;}
.opt.sel{background:rgba(37,99,235,0.15);border-color:var(--primary);}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90%;text-align:center;}
.toast.err{background:var(--red);} .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.overlay{position:fixed;inset:0;background:rgba(7,9,14,0.85);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.overlay.hidden{display:none;}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;width:100%;max-width:340px;box-shadow:0 16px 40px rgba(0,0,0,0.5);}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px 16px;text-align:center;color:var(--muted);} .empty .ic{font-size:48px;margin-bottom:12px;}
.divider{height:16px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="overlay" class="overlay hidden"><div class="modal-card" style="text-align:center">
  <div class="spinner"></div>
  <div style="font-weight:800;font-size:16px;margin-bottom:6px;">Analizando ticket con IA...</div>
  <div class="muted" style="font-size:13px;">Extrayendo productos y precios</div>
</div></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const fileInput = $('#fileInput');

const store = {
  get(k, d){ try{ const v = localStorage.getItem('mt_'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('mt_'+k, JSON.stringify(v)); }
};
let profile = store.get('profile', null);
let txs = store.get('txs', []);
let notif = store.get('notif', {scan_reminder:true, budget_alert:true, fugas_alert:true, debt_opportunity:true});
let apiUrl = store.get('api', '');
let hideBalance = false;
let onboardingData = {};
let lastScan = null;
let currentTab = 'home';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + (Number(n)||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const money2 = n => '$ ' + (Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const thisMonth = () => new Date().toISOString().slice(0,7);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(()=> t.className='toast', 3000);
}
function overlay(show){ $('#overlay').classList.toggle('hidden', !show); }
function fmtNumInput(el){
  const digits = (el.value||'').replace(/\D/g,'').slice(0,10);
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
}
function parseNum(s){ return Number(String(s||'').replace(/,/g,'').replace('$','').trim()) || 0; }

function monthlySummary(month){
  month = month || thisMonth();
  let t=0, spent=0, fugas=0;
  txs.forEach(x => { if((x.date||'').slice(0,7)===month){ t++; spent+=x.total_amount||0; if(x.category==='Fugas_Invisibles') fugas+=x.total_amount||0; } });
  return {tickets:t, spent, fugas};
}
function lastScanDate(){ return txs.length ? txs.map(x=>x.date).sort().pop() : null; }
function topMerchants(limit){
  const agg = {};
  txs.forEach(x => { if((x.date||'').slice(0,7)===thisMonth()) agg[x.merchant_name] = (agg[x.merchant_name]||0) + (x.total_amount||0); });
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0, limit||5);
}
function monthsWithData(){
  const set = new Set(txs.map(x => (x.date||'').slice(0,7)).filter(Boolean));
  const m = thisMonth(); if(!set.has(m)) set.add(m);
  return [...set].sort().reverse();
}
function chartData(){
  const map = {}; const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    map[k] = {total:0, fugas:0};
  }
  txs.forEach(x => {
    const k = (x.date||'').slice(0,7);
    if(map[k]){ map[k].total += x.total_amount||0; if(x.category==='Fugas_Invisibles') map[k].fugas += x.total_amount||0; }
  });
  return Object.entries(map);
}
function coachAlerts(){
  const a = []; if(!profile) return a;
  const s = monthlySummary();
  const avail = profile.available_real||0, name = profile.name;
  if(notif.scan_reminder){
    const l = lastScanDate();
    if(l){ const days = Math.floor((Date.now()-new Date(l).getTime())/86400000);
      if(days>7) a.push(['📸',`Hace ${days} días sin escanear`,`${name}, escanea tu próximo ticket para mantener el control.`,'var(--accent)']);
    } else if(s.tickets===0) a.push(['🚀','Primer paso',`${name}, escanea tu primer ticket para que tu copiloto empiece a aprender.`,'var(--green)']);
  }
  if(notif.fugas_alert && s.spent>0 && (s.fugas/s.spent)>0.25)
    a.push(['🔥','Fugas detectadas',`Llevas ${money(s.fugas)} en gastos no esenciales (${Math.round(s.fugas/s.spent*100)}%).`,'var(--orange)']);
  if(notif.budget_alert && avail>0 && s.spent > avail*0.85)
    a.push(['⚠️','Presupuesto bajo',`Solo quedan ${money(avail-s.spent)} de tu disponible real.`,'var(--red)']);
  return a;
}
function saveTxLocal(data){
  txs.unshift({
    id: Date.now(), date: data.date || today(), merchant_name: data.merchant_name || 'Desconocido',
    total_amount: data.total_amount||0, currency: data.currency||'MXN',
    category: data.category||'Gasto_Normal', items: data.items||[], notes: data.notes||'',
    created_at: new Date().toISOString()
  });
  store.set('txs', txs);
}
function exportCSV(){
  let csv = 'Fecha,Comercio,Total,Categoria,Esenciales,No Esenciales,Notas\n';
  txs.forEach(t => {
    const ess = (t.items||[]).filter(i=>i.is_essential).length;
    csv += [t.date, `"${(t.merchant_name||'').replace(/"/g,'""')}"`, t.total_amount, t.category, ess, (t.items||[]).length-ess, `"${(t.notes||'').replace(/"/g,'""')}"`].join(',') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'myticket_export.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exportado con éxito');
}

/* Componentes Comunes IU */
function bottomNav(activeTab){
  return `<nav class="bottom-nav">
    <button class="nav-item ${activeTab==='home'?'active':''}" onclick="navigate('home')"><span class="icon">🏠</span>Inicio</button>
    <button class="nav-item ${activeTab==='history'?'active':''}" onclick="navigate('history')"><span class="icon">🕘</span>Historial</button>
    <button class="scan-fab" onclick="openScanDialog()" title="Escanear">📸</button>
    <button class="nav-item ${activeTab==='stats'?'active':''}" onclick="navigate('stats')"><span class="icon">📊</span>Análisis</button>
    <button class="nav-item ${activeTab==='profile'?'active':''}" onclick="navigate('profile')"><span class="icon">👤</span>Perfil</button>
  </nav>`;
}
function navigate(tab){
  currentTab = tab;
  if(tab==='home') renderHome();
  else if(tab==='history') renderHistory();
  else if(tab==='stats') renderStats();
  else if(tab==='profile') renderProfile();
}
function barChart(){
  const rows = chartData();
  if(!txs.length) return `<div class="chart-card" style="text-align:center;color:var(--muted)">Sin tickets registrados para gráfica</div>`;
  const max = Math.max(...rows.map(r=>r[1].total), 1);
  const bars = rows.map(([m,d]) => {
    const th = Math.max(4, d.total/max*100);
    const fh = d.total>0 ? d.fugas/max*100 : 0;
    return `<div class="bar-col"><div class="bar-stack" style="height:100px;">
      <div class="bar-fug" style="height:${fh}px"></div>
      <div class="bar-ess" style="height:${Math.max(0,th-fh)}px"></div></div>
      <div class="bar-lbl">${m.slice(5)}</div></div>`;
  }).join('');
  return `<div class="chart-card"><div class="chart-title">Evolución mensual de gastos</div>
    <div class="bars">${bars}</div>
    <div class="legend"><span><span class="sw" style="background:var(--green)"></span>Esencial</span>
    <span><span class="sw" style="background:var(--orange)"></span>Fugas</span></div></div>`;
}
function mini(l, v, c){
  return `<div class="mini"><div class="l">${l}</div><div class="v" ${c?`style="color:${c}"`:''}>${v}</div></div>`;
}
function alertCard(em, t, m, c){
  return `<div class="alert-card" style="background:${c}15;border:1px solid ${c}30"><span class="emoji">${em}</span><div><div class="t" style="color:${c}">${t}</div><div class="m">${m}</div></div></div>`;
}

/* ============================================================
   ONBOARDING (5 Pasos)
   ============================================================ */
function dots(cur){
  return `<div class="dots">${[0,1,2,3,4].map(i=>`<div class="dot ${i<cur?'done':i===cur?'cur':''}"></div>`).join('')}</div>`;
}
function renderStep1(){
  app.innerHTML = `<div class="screen">${dots(0)}
    <h2 style="font-size:24px;margin:0 0 6px;font-weight:800">Bienvenido a MyTicket</h2>
    <p class="hint">Paso 1 de 5 — Tu identidad en la app</p>
    <div class="card"><h3>¿Cómo te llamas?</h3>
      <p class="hint">Un apodo o nombre para personalizar tus reportes financieros.</p>
      <input class="input" id="ob-name" placeholder="Ej: Papá Juan, Mamá, Yo..." maxlength="30"></div>
    <button class="btn" onclick="obNext1()">Continuar ➜</button></div>`;
  setTimeout(()=> $('#ob-name').focus(), 100);
}
function obNext1(){
  const v = $('#ob-name').value.trim();
  if(!v) return toast('Por favor escribe un nombre', true);
  onboardingData.name = v; renderStep2();
}
function renderStep2(){

function openScanDialog(){
  overlay(false);
  app.insertAdjacentHTML('beforeend', `<div class="overlay" id="scanDlg"><div class="modal-card">
    <h3 style="margin:0 0 6px">Escanear ticket</h3>
    <p class="muted" style="font-size:13px;margin:0 0 16px">Selecciona el origen de la imagen</p>
    <button class="btn" onclick="pickImage('camera')">📷 Tomar foto</button>
    <button class="btn purple" onclick="pickImage('gallery')">🖼️ Elegir de galería</button>
    <button class="btn ghost" onclick="$('#scanDlg').remove()">Cancelar</button></div></div>`);
}
function pickImage(source){
  $('#scanDlg').remove();
  if(source==='camera') fileInput.setAttribute('capture','environment'); else fileInput.removeAttribute('capture');
  fileInput.value = ''; fileInput.click();
}
fileInput.addEventListener('change', () => { if(fileInput.files[0]) processScan(fileInput.files[0]); });

function compressImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const max = 1024; let w = img.width, h = img.height;
      if(w > max){ h = Math.round(h * max/w); w = max; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}
async function processScan(file){
  if(!apiUrl){ toast('⚠️ Configura tu Backend API URL en tu Perfil', true); return navigate('profile'); }
  overlay(true);
  try{
    const blob = await compressImage(file);
    const fd = new FormData(); fd.append('file', blob, 'ticket.jpg');
    let result = null, err = '';
    for(let attempt=0; attempt<2 && !result; attempt++){
      try{
        const r = await fetch(apiUrl.replace(/\/+$/,'') + '/scan-ticket', { method:'POST', body:fd });
        const j = await r.json();
        if(r.ok && !j.error) result = j; else err = j.error || ('Error HTTP: ' + r.status);
      }catch(ex){ err = ex.message; }
      if(!result && attempt===0) await new Promise(r=>setTimeout(r,2000));
    }
    overlay(false);
    if(result){ lastScan = result; renderResult(); }
    else toast('Error: ' + (err || 'no se pudo analizar el ticket'), true);
  }catch(e){ overlay(false); toast('Error: ' + e.message, true); }
}

function renderResult(){
  const d = lastScan; if(!d) return navigate('home');
  const items = d.items || [];
  let essT = 0, fugT = 0;
  items.forEach(i => { i.is_essential ? essT += (i.price||0) : fugT += (i.price||0); });
  const total = d.total_amount || essT + fugT;
  const essPct = total>0 ? essT/total*100 : 0, fugPct = total>0 ? fugT/total*100 : 0;

  app.innerHTML = `<div class="screen">
    <div class="bank-header"><h2 style="font-size:18px;margin:0">Resultado del Análisis</h2><button class="icon-btn" onclick="navigate('home')">✕</button></div>
    <div class="card" style="text-align:center">
      <h3 style="font-size:18px">${esc(d.merchant_name||'Comercio')}</h3>
      <p class="muted" style="font-size:12px;margin:2px 0 10px">${esc(d.date||today())}</p>
      <div style="font-size:28px;font-weight:800;color:var(--accent)">${money2(total)} MXN</div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Clasificación de productos</div>
      <div class="pbar-wrap h14"><div class="pbar-ess" style="width:${essPct}%"></div><div class="pbar-fug" style="width:${fugPct}%"></div></div>
      <div class="legend"><span style="color:var(--green)">Esencial ${essPct.toFixed(0)}%</span><span style="color:var(--orange)">Fugas ${fugPct.toFixed(0)}%</span></div>
    </div>
    <p style="font-size:14px;font-weight:700;margin:4px 0 10px">Artículos detectados (${items.length}):</p>
    <div style="max-height:220px;overflow-y:auto;margin-bottom:14px">
      ${items.length ? items.map(i=>`<div class="item-row">
        <span class="ic">${i.is_essential?'🟢':'🟠'}</span>
        <span class="nm"><span class="n">${esc(i.name)}</span><br><span class="e">${i.is_essential?'Esencial':'No esencial'}</span></span>
        <span class="pr">${money2(i.price||0)}</span></div>`).join('') : '<div class="empty">Sin artículos individuales</div>'}
    </div>
    <div class="card"><label class="lbl">Nota opcional</label><textarea class="input" id="res-notes" placeholder="Ej: Supermercado semanal..."></textarea></div>
    <button class="btn green" onclick="saveResult(true)">💾 Guardar ticket</button>
    <button class="btn secondary" onclick="navigate('home')">Descartar</button>
  </div>${bottomNav('home')}`;
}
function saveResult(goHome){
  const d = lastScan || {};
  const items = d.items || [];
  const fugT = items.filter(i=>!i.is_essential).reduce((s,i)=>s+(i.price||0),0);
  const total = d.total_amount || items.reduce((s,i)=>s+(i.price||0),0);
  d.category = (total>0 && fugT/total>0.3) ? 'Fugas_Invisibles' : 'Gasto_Normal';
  d.notes = $('#res-notes') ? $('#res-notes').value : '';
  saveTxLocal(d);
  toast('¡Ticket guardado correctamente!');
  navigate(goHome ? 'home' : 'history');
}
