<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyTicket</title>
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0D1117; --card:#161B22; --border:#30363D; --green:#238636; --blue:#58A6FF;
  --orange:#F0883E; --red:#F85149; --purple:#8957E5; --gray:#6E7681;
  --text:#FFFFFF; --muted:#8B949E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
.screen{flex:1;display:flex;flex-direction:column;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.appbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;margin:-16px -16px 16px;}
.appbar h1{font-size:18px;margin:0;font-weight:700;}
.appbar .ab-btns{display:flex;gap:4px;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:20px;padding:8px;cursor:pointer;border-radius:10px;}
.icon-btn:active{background:#21262D;}
h2.title{font-size:24px;margin:0 0 4px;font-weight:800;}
p.sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;width:100%;}
.card h3{margin:0 0 10px;font-size:17px;font-weight:600;}
.card p.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5;}
.insight{background:#23863610;border:1px solid #23863640;border-radius:12px;padding:14px;
  font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;width:100%;}
.alert-card{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px;margin-bottom:10px;width:100%;}
.alert-card .emoji{font-size:26px;line-height:1;}
.alert-card .t{font-size:14px;font-weight:700;margin-bottom:2px;}
.alert-card .m{font-size:12px;color:var(--muted);line-height:1.4;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;cursor:pointer;
  border-radius:16px;padding:18px 20px;font-size:17px;font-weight:700;color:#fff;background:var(--green);
  margin-bottom:10px;min-height:56px;transition:transform .08s;}
.btn:active{transform:scale(.97);}
.btn.small{padding:12px 16px;font-size:14px;border-radius:12px;min-height:44px;width:auto;}
.btn.blue{background:#1F6FEB;} .btn.purple{background:var(--purple);} .btn.gray{background:var(--gray);}
.btn.outline{background:transparent;border:2px solid var(--red);color:var(--red);}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;}
.row{display:flex;gap:10px;width:100%;}
.row.between{justify-content:space-between;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);
  padding:14px;font-size:16px;margin-bottom:10px;outline:none;}
.input:focus{border-color:var(--blue);}
textarea.input{resize:vertical;min-height:70px;}
label.lbl{font-size:13px;color:var(--muted);display:block;margin:0 0 6px 2px;}
select.input{appearance:none;}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.dot{width:32px;height:6px;border-radius:3px;background:var(--border);}
.dot.done{background:var(--green);} .dot.cur{background:var(--blue);}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--text);}
.opt .em{font-size:24px;}
.opt .tt{font-size:15px;font-weight:700;} .opt .dd{font-size:12px;color:var(--muted);}
.opt.sel{background:#23863620;border:2px solid var(--green);margin-bottom:7px;}
.math-line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0;}
.math-big{font-size:20px;font-weight:800;color:var(--blue);padding:8px 0;}
.mini-grid{display:flex;gap:10px;width:100%;margin-bottom:14px;}
.mini{flex:1;background:var(--card);border-radius:12px;padding:14px 8px;text-align:center;}
.mini .l{font-size:11px;color:var(--muted);} .mini .v{font-size:17px;font-weight:800;margin-top:3px;}
.pbar-wrap{background:var(--border);border-radius:6px;height:8px;overflow:hidden;display:flex;width:100%;}
.pbar-wrap.h10{height:10px;border-radius:5px;} .pbar-wrap.h16{height:16px;border-radius:8px;}
.pbar-spent{background:var(--red);height:100%;}
.pbar-rest{background:var(--green);height:100%;}
.pbar-ess{background:var(--green);height:100%;}
.pbar-fug{background:var(--orange);height:100%;}
.pbar-fill{background:var(--orange);height:100%;border-radius:5px;}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:8px;align-items:center;}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;width:100%;}
.chart-title{font-size:14px;font-weight:700;margin-bottom:12px;}
.bars{display:flex;justify-content:space-around;align-items:flex-end;height:130px;gap:6px;}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:44px;}
.bar-stack{display:flex;flex-direction:column;justify-content:flex-end;width:26px;}
.bar-ess{background:var(--green);border-radius:4px 4px 0 0;width:100%;}
.bar-fug{background:var(--orange);border-radius:0 0 4px 4px;width:100%;}
.bar-lbl{font-size:10px;color:var(--muted);margin-top:6px;}
.tx-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;width:100%;}
.tx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tx-name{font-weight:700;font-size:15px;} .tx-amt{font-weight:800;color:var(--blue);white-space:nowrap;}
.tx-date{font-size:12px;color:var(--muted);margin:4px 0;}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;margin-right:6px;}
.chip.ess{background:#23863615;color:var(--green);} .chip.fug{background:#F0883E15;color:var(--orange);}
.chip.cat-ess{background:#23863615;color:var(--green);} .chip.cat-fug{background:#F0883E15;color:var(--orange);}
.tx-notes{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;}
.item-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.item-row .ic{font-size:18px;} .item-row .nm{flex:1;} .item-row .nm .n{font-size:15px;font-weight:600;}
.item-row .nm .e{font-size:11px;color:var(--muted);} .item-row .pr{font-weight:800;font-size:15px;}
.switch{position:relative;width:48px;height:28px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.sl{position:absolute;inset:0;background:var(--border);border-radius:28px;transition:.2s;cursor:pointer;}
.sl:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;}
.switch input:checked + .sl{background:var(--green);}
.switch input:checked + .sl:before{transform:translateX(20px);}
.center{text-align:center;} .muted{color:var(--muted);}
.big-emoji{font-size:44px;text-align:center;margin:8px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--green);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%;text-align:center;}
.toast.err{background:var(--red);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.overlay{position:fixed;inset:0;background:rgba(13,17,23,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;}
.overlay.hidden{display:none;}
.spinner{width:56px;height:56px;border:5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:340px;}
.empty{padding:40px 16px;text-align:center;color:var(--muted);}
.empty .ic{font-size:52px;margin-bottom:12px;}
.avatar{font-size:60px;text-align:center;color:var(--blue);margin-bottom:6px;}
.divider{height:14px;}
.stat-line{display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13px;}
a.link{color:var(--blue);}
@media (max-width:360px){ h2.title{font-size:21px;} .btn{font-size:16px;padding:16px;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="overlay" class="overlay hidden"><div class="modal-card center">
  <div class="spinner"></div>
  <div style="font-weight:800;font-size:16px;margin-bottom:6px;">Analizando ticket con IA...</div>
  <div class="muted" style="font-size:13px;">Leyendo productos y precios</div>
</div></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
/* ============================================================
   MyTicket — Web Edition (GitHub Pages ready)
   Almacenamiento: localStorage | Backend: URL configurable
   ============================================================ */
const $ = s => document.querySelector(s);
const app = $('#app');
const fileInput = $('#fileInput');

/* ---------- Persistencia ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mt_'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('mt_'+k, JSON.stringify(v)); }
};
let profile = store.get('profile', null);
let txs = store.get('txs', []);
let notif = store.get('notif', {scan_reminder:true, budget_alert:true, fugas_alert:true, debt_opportunity:true});
let apiUrl = store.get('api', '');

let onboardingData = {};
let lastScan = null;

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + (Number(n)||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const money2 = n => '$ ' + (Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const thisMonth = () => new Date().toISOString().slice(0,7);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(()=> t.className='toast', 3000);
}
function overlay(show){ $('#overlay').classList.toggle('hidden', !show); }
function fmtNumInput(el){
  const digits = (el.value||'').replace(/\D/g,'').slice(0,10);
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
}
function parseNum(s){ return Number(String(s||'').replace(/,/g,'').replace('$','').trim()) || 0; }

/* ---------- Lógica de datos (portada de la app Flet) ---------- */
function monthlySummary(month){
  month = month || thisMonth();
  let t=0, spent=0, fugas=0;
  txs.forEach(x => { if((x.date||'').slice(0,7)===month){ t++; spent+=x.total_amount||0; if(x.category==='Fugas_Invisibles') fugas+=x.total_amount||0; } });
  return {tickets:t, spent, fugas};
}
function weeklyFugas(){
  const lim = Date.now() - 7*86400000; let s=0;
  txs.forEach(x => { if(x.category==='Fugas_Invisibles' && new Date(x.date).getTime() >= lim) s += x.total_amount||0; });
  return s;
}
function lastScanDate(){ return txs.length ? txs.map(x=>x.date).sort().pop() : null; }
function topMerchants(limit){
  const agg = {};
  txs.forEach(x => { if((x.date||'').slice(0,7)===thisMonth()) agg[x.merchant_name] = (agg[x.merchant_name]||0) + (x.total_amount||0); });
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0, limit||5);
}
function monthsWithData(){
  const set = new Set(txs.map(x => (x.date||'').slice(0,7)).filter(Boolean));
  const m = thisMonth(); if(!set.has(m)) set.add(m);
  return [...set].sort().reverse();
}
function chartData(){
  const map = {};
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    map[k] = {total:0, fugas:0};
  }
  txs.forEach(x => {
    const k = (x.date||'').slice(0,7);
    if(map[k]){ map[k].total += x.total_amount||0; if(x.category==='Fugas_Invisibles') map[k].fugas += x.total_amount||0; }
  });
  return Object.entries(map);
}
function coachAlerts(){
  const a = []; if(!profile) return a;
  const s = monthlySummary();
  const avail = profile.available_real||0, debt = profile.debt_amount||0, name = profile.name;
  if(notif.scan_reminder){
    const l = lastScanDate();
    if(l){ const days = Math.floor((Date.now()-new Date(l).getTime())/86400000);
      if(days>7) a.push(['📸',`Hace ${days} días sin escanear`,`${name}, escanea tu próximo ticket para mantener el control.`,'var(--blue)']);
    } else if(s.tickets===0) a.push(['🚀','Primer paso',`${name}, escanea tu primer ticket para que tu copiloto empiece a aprender de ti.`,'var(--green)']);
  }
  if(notif.fugas_alert && s.spent>0 && (s.fugas/s.spent)>0.25)
    a.push(['🔥','Fugas detectadas',`Llevas ${money(s.fugas)} en gastos no esenciales (${Math.round(s.fugas/s.spent*100)}%). Es momento de revisar.`,'var(--orange)']);
  if(notif.budget_alert && avail>0 && s.spent > avail*0.85)
    a.push(['⚠️','Presupuesto bajo',`Solo te quedan ${money(avail-s.spent)} de tu disponible real. Cuidado con los gastos.`,'var(--red)']);
  if(notif.debt_opportunity && debt>0 && s.fugas>0){
    const w = weeklyFugas();
    if(w>0){ const ms = Math.floor(debt/500 - debt/(500+w/4)); if(ms>0)
      a.push(['🛣️','Oportunidad de rescate',`Redirige la mitad de tus fugas a tu deuda y terminas ${ms} meses antes.`,'var(--blue)']); }
  }
  return a;
}
function saveTxLocal(data){
  txs.unshift({
    id: Date.now(), date: data.date || today(), merchant_name: data.merchant_name || 'Desconocido',
    total_amount: data.total_amount||0, currency: data.currency||'MXN',
    category: data.category||'Gasto_Normal', items: data.items||[], notes: data.notes||'',
    created_at: new Date().toISOString()
  });
  store.set('txs', txs);
}
function exportCSV(){
  let csv = 'Fecha,Comercio,Total,Categoria,Productos Esenciales,Productos No Esenciales,Notas\n';
  txs.forEach(t => {
    const ess = (t.items||[]).filter(i=>i.is_essential).length;
    csv += [t.date, `"${(t.merchant_name||'').replace(/"/g,'""')}"`, t.total_amount, t.category, ess, (t.items||[]).length-ess, `"${(t.notes||'').replace(/"/g,'""')}"`].join(',') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'myticket_export.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exportado');
}

/* ---------- Componentes HTML ---------- */
const dots = (step, total=5) => `<div class="dots">${Array.from({length:total},(_,i)=>
  `<div class="dot ${i<step?'done':i===step?'cur':''}"></div>`).join('')}</div>`;
const insight = t => `<div class="insight">${t}</div>`;
const alertCard = (e,t,m,c) => `<div class="alert-card" style="background:${c}10;border:1px solid ${c}40;">
  <div class="emoji">${e}</div><div><div class="t" style="color:${c}">${t}</div><div class="m">${m}</div></div></div>`;
const mini = (l,v,c) => `<div class="mini"><div class="l">${l}</div><div class="v" style="color:${c||'var(--text)'}">${v}</div></div>`;
function barChart(){
  const rows = chartData();
  if(!txs.length) return `<div class="chart-card center muted">Escanear tickets para ver tu gráfica</div>`;
  const max = Math.max(...rows.map(r=>r[1].total), 1);
  const bars = rows.map(([m,d]) => {
    const th = Math.max(4, d.total/max*110);
    const fh = d.total>0 ? d.fugas/max*110 : 0;
    return `<div class="bar-col"><div class="bar-stack" style="height:110px;">
      <div class="bar-ess" style="height:${Math.max(0,th-fh)}px"></div>
      <div class="bar-fug" style="height:${fh}px"></div></div>
      <div class="bar-lbl">${m.slice(5)}</div></div>`;
  }).join('');
  return `<div class="chart-card"><div class="chart-title">Gastos últimos meses</div>
    <div class="bars">${bars}</div>
    <div class="legend"><span><span class="sw" style="background:var(--green)"></span>Gasto</span>
    <span><span class="sw" style="background:var(--orange)"></span>Fugas</span></div></div>`;
}

/* ============================================================
   ONBOARDING (5 pasos)
   ============================================================ */
function renderStep1(){
  app.innerHTML = `<div class="screen">${dots(0)}
    <h2 class="title">Bienvenido a MyTicket</h2>
    <p class="sub">Paso 1 de 5 — Configuración personal</p>
    <div class="card"><h3>¿Quién usará esta app?</h3>
      <p class="hint">No necesitamos tu nombre real. Solo un apodo para personalizar tu experiencia.</p>
      <input class="input" id="ob-name" placeholder="Ej: Papá Juan, Doña María, Yo..." maxlength="30"></div>
    ${insight('La app dirá "Papá Juan, este mes llevas $340 en antojos" en vez de "Usuario_102". La familiaridad genera confianza.')}
    <button class="btn" onclick="obNext1()">Siguiente ➜</button></div>`;
  setTimeout(()=> $('#ob-name').focus(), 100);
}
function obNext1(){
  const v = $('#ob-name').value.trim();
  if(!v) return toast('Por favor escribe un nombre', true);
  onboardingData.name = v; renderStep2();
}
function renderStep2(){
  const opts = [['fijo','💼','Salario fijo','Quincena o mensualidad estable'],
    ['eventual','🔧','Trabajo informal','Ingresos variables, jornales, freelance'],
    ['negocio','🏪','Negocio propio','Ventas, comercio, servicios propios'],
    ['pension','🧓','Pensión / Jubilación','Ingreso fijo de retiro']];
  app.innerHTML = `<div class="screen">${dots(1)}
    <h2 class="title">Tus ingresos</h2>
    <p class="sub">Paso 2 de 5 — Sin datos bancarios</p>
    <div class="card"><h3>¿Cómo llega tu dinero?</h3>
      ${opts.map(o=>`<button class="opt" data-v="${o[0]}" onclick="obPickType(this)"><span class="em">${o[1]}</span>
        <span><span class="tt">${o[2]}</span><br><span class="dd">${o[3]}</span></span></button>`).join('')}
      <div class="divider"></div>
      <input class="input" id="ob-income" inputmode="numeric" placeholder="¿Cuánto ganas al mes (aprox)?" oninput="fmtNumInput(this)">
      <div class="center" id="ob-income-disp" style="color:var(--blue);font-weight:700;">$ 0 MXN</div></div>
    ${insight('Si tu ingreso es eventual, la app te dirá "Llevas 60% de tu promedio mensual" en vez de regañarte. Contexto real.')}
    <div class="row between">
      <button class="btn ghost" style="width:auto" onclick="renderStep1()">‹ Atrás</button>
      <button class="btn" style="width:70%" onclick="obNext2()">Siguiente ➜</button></div></div>`;
  $('#ob-income').addEventListener('input', ()=> $('#ob-income-disp').textContent = money(parseNum($('#ob-income').value)) + ' MXN');
  obPickType(document.querySelector('.opt'));
}
function obPickType(el){
  onboardingData.income_type = el.dataset.v;
  document.querySelectorAll('.opt').forEach(o=> o.classList.toggle('sel', o===el));
}
function obNext2(){
  const amt = parseNum($('#ob-income').value);
  if(amt<=0) return toast('Por favor ingresa un monto válido', true);
  onboardingData.income_amount = amt; renderStep3();
}
function renderStep3(){
  const income = onboardingData.income_amount;
  app.innerHTML = `<div class="screen">${dots(2)}
    <h2 class="title">Gastos que no puedes evitar</h2>
    <p class="sub">Paso 3 de 5 — Lo que ya está comprometido</p>
    <div class="card"><h3>¿Qué pagas SÍ o SÍ cada mes?</h3>
      <p class="hint">Renta, luz, agua, internet, teléfono, gasolina fija, medicinas recurrentes...</p>
      <input class="input" id="ob-fixed" inputmode="numeric" placeholder="Ej: 8,500" oninput="fmtNumInput(this);obMath()">
      <div class="center" id="ob-fixed-disp" style="color:var(--blue);font-weight:700;">$ 0 MXN</div></div>
    <div class="card" id="ob-math"></div>

function pickImage(source){
  $('#scanDlg').remove();
  if(source==='camera') fileInput.setAttribute('capture','environment'); else fileInput.removeAttribute('capture');
  fileInput.value = ''; fileInput.click();
}
fileInput.addEventListener('change', () => { if(fileInput.files[0]) processScan(fileInput.files[0]); });

function compressImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const max = 1024; let w = img.width, h = img.height;
      if(w > max){ h = Math.round(h * max/w); w = max; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}
async function processScan(file){
  if(!apiUrl){ toast('⚠️ Primero configura la URL de tu backend en Mi Perfil', true); return renderProfile(); }
  overlay(true);
  try{
    const blob = await compressImage(file);
    const fd = new FormData();
    fd.append('file', blob, 'ticket.jpg');
    let result = null, err = '';
    for(let attempt=0; attempt<2 && !result; attempt++){
      try{
        const r = await fetch(apiUrl.replace(/\/+$/,'') + '/scan-ticket', { method:'POST', body:fd });
        const j = await r.json();
        if(r.ok && !j.error) result = j; else err = j.error || ('Error del servidor: ' + r.status);
      }catch(ex){ err = ex.message; }
      if(!result && attempt===0) await new Promise(r=>setTimeout(r,2000));
    }
    overlay(false);
    if(result){ lastScan = result; renderResult(); }
    else toast('Error: ' + (err || 'no se pudo analizar'), true);
  }catch(e){ overlay(false); toast('Error: ' + e.message, true); }
}

    ${appbar('Alertas del Coach', 'renderHome()')}
    <p class="muted" style="font-size:14px">Elige qué alertas quieres recibir</p>
    ${row('scan_reminder','Recordatorio de escaneo','Si llevas más de 7 días sin escanear')}
    ${row('budget_alert','Alerta de presupuesto','Cuando tu disponible real baje del 15%')}
    ${row('fugas_alert','Alerta de fugas','Cuando tus gastos no esenciales superen el 25%')}
    ${row('debt_opportunity','Oportunidades de deuda','Sugerencias para acelerar tu Ruta de Rescate')}
    ${insight('Estas alertas aparecen en la pantalla principal. En el futuro podrán llegar como notificaciones push.')}
    <button class="btn" onclick="saveNotif()">💾 Guardar configuración</button></div>`;
}
function saveNotif(){
  ['scan_reminder','budget_alert','fugas_alert','debt_opportunity'].forEach(k => notif[k] = $('#nt-'+k).checked);
  store.set('notif', notif);
  toast('Configuración de alertas guardada');
  renderHome();
}

/* ============================================================
   PERFIL
   ============================================================ */
function renderProfile(){
  const p = profile, totalAll = txs.reduce((s,t)=>s+(t.total_amount||0),0), avg = txs.length ? totalAll/txs.length : 0;
  const tops = topMerchants(3);
  const types = [['fijo','💼','Salario fijo'],['eventual','🔧','Informal'],['negocio','🏪','Negocio'],['pension','🧓','Pensión']];
  const progress = p.debt_amount>0 ? Math.min(100, (txs.filter(t=>t.category==='Fugas_Invisibles').reduce((s,t)=>s+(t.total_amount||0),0)*0.3)/p.debt_amount*100) : 0;
  app.innerHTML = `<div class="screen">
    ${appbar('Mi Perfil', 'renderHome()')}
    <div class="avatar">👤</div>
    <h2 class="center title">${esc(p.name)}</h2>
    <p class="sub center" style="margin-bottom:16px">Configuración financiera</p>
    <div class="row wrap" style="margin-bottom:14px" id="prof-types">
      ${types.map(t=>`<button class="opt ${p.income_type===t[0]?'sel':''}" data-v="${t[0]}" onclick="profPickType(this)" style="width:auto;padding:8px 12px;margin:0 6px 8px 0">
        <span style="font-size:18px">${t[1]}</span><span class="tt" style="font-size:13px">${t[2]}</span></button>`).join('')}</div>
    <label class="lbl">Nombre / Apodo</label><input class="input" id="pf-name" value="${esc(p.name)}">
    <label class="lbl">Ingreso mensual</label><input class="input" id="pf-income" inputmode="numeric" value="${(p.income_amount||0).toLocaleString('en-US')}" oninput="fmtNumInput(this);profCalc()">
    <label class="lbl">Gastos fijos</label><input class="input" id="pf-fixed" inputmode="numeric" value="${(p.fixed_expenses||0).toLocaleString('en-US')}" oninput="fmtNumInput(this);profCalc()">
    <div class="center" id="pf-avail" style="color:var(--blue);font-weight:800;font-size:17px;margin:6px 0 12px"></div>
    <label class="lbl">Deuda total</label><input class="input" id="pf-debt" inputmode="numeric" value="${(p.debt_amount||0).toLocaleString('en-US')}" oninput="fmtNumInput(this)">
    <label class="lbl">Interés anual aprox (%)</label><input class="input" id="pf-interest" inputmode="numeric" value="${p.debt_interest||''}">
    <label class="lbl">Meta de ahorro mensual</label><input class="input" id="pf-savings" inputmode="numeric" value="${p.savings_goal?(p.savings_goal).toLocaleString('en-US'):''}" oninput="fmtNumInput(this)">
    <div class="divider"></div>
    <div class="card" style="border-color:var(--blue)"><h3 style="font-size:14px;color:var(--blue)">🔌 Backend (donde vive tu key de Groq)</h3>
      <p class="hint">Pega aquí la URL de tu backend (Cloudflare Worker). Tu API key <b>NUNCA</b> se guarda en esta web; vive solo en el servidor.</p>
      <input class="input" id="pf-api" placeholder="https://tu-worker.tu-usuario.workers.dev" value="${esc(apiUrl)}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="hint" style="margin:0;font-size:12px">📖 Guía para crearlo: busca "Cloudflare Workers" en la documentación que te compartí.</p></div>
    ${p.debt_amount>0?`<div class="card" style="border-color:#F0883E40"><div style="font-size:14px;font-weight:700;color:var(--orange)">🛣️ Progreso Ruta de Rescate</div>
      <div class="pbar-wrap" style="margin:10px 0 6px"><div class="pbar-fill" style="width:${progress}%"></div></div>
      <p class="muted" style="font-size:12px;margin:0">Estimado pagado: ${money(p.debt_amount*progress/100)} de ${money(p.debt_amount)} (${progress.toFixed(1)}%)</p></div>`:''}
    <p style="font-size:16px;font-weight:600;margin:8px 0 10px">Tus estadísticas</p>
    <div class="mini-grid">${mini('Tickets', txs.length)}${mini('Promedio', money(avg))}${mini('Total', money(totalAll))}</div>
    <p style="font-size:14px;font-weight:600;margin:4px 0 8px">Comercios más frecuentes</p>
    ${tops.length ? tops.map(t=>`<div class="stat-line"><span>${esc(t[0])}</span><b style="color:var(--blue)">${money(t[1])}</b></div>`).join('')
      : '<p class="muted" style="font-size:12px">Aún no hay datos suficientes</p>'}
    <div class="divider"></div>
    <button class="btn" onclick="saveProfile()">💾 Guardar Cambios</button>
    <button class="btn outline" onclick="resetApp()">🗑️ Reiniciar app (borrar todo)</button></div>`;
  profCalc();
}
let profType = profile ? profile.income_type : 'fijo';
function profPickType(el){ profType = el.dataset.v; document.querySelectorAll('#prof-types .opt').forEach(o=>o.classList.toggle('sel', o===el)); }
function profCalc(){
  const avail = Math.max(0, parseNum($('#pf-income').value) - parseNum($('#pf-fixed').value));
  $('#pf-avail').textContent = 'Disponible REAL: ' + money(avail) + ' MXN';
}
function saveProfile(){
  const inc = parseNum($('#pf-income').value), fix = parseNum($('#pf-fixed').value);
  profile = { ...profile, name: $('#pf-name').value.trim() || profile.name, income_type: profType,
    income_amount: inc, fixed_expenses: fix, available_real: Math.max(0, inc-fix),
    debt_amount: parseNum($('#pf-debt').value), debt_interest: parseNum($('#pf-interest').value),
    savings_goal: parseNum($('#pf-savings').value) };
  apiUrl = $('#pf-api').value.trim();
  store.set('profile', profile); store.set('api', apiUrl);
  toast('Perfil actualizado correctamente');
  renderHome();
}
function resetApp(){
  if(!confirm('¿Reiniciar MyTicket?\n\nSe borrarán TODOS tus datos: perfil, tickets e historial. Esta acción no se puede deshacer.')) return;
  localStorage.removeItem('mt_profile'); localStorage.removeItem('mt_txs');
  localStorage.removeItem('mt_notif');
  profile = null; txs = []; notif = {scan_reminder:true,budget_alert:true,fugas_alert:true,debt_opportunity:true};
  toast('App reiniciada. Configura tu perfil de nuevo.');
  renderStep1();
}

/* ---------- Arranque ---------- */
profile ? renderHome() : renderStep1();
</script>
</body>
</html>
