<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Tus enlaces de configuración y recursos nativos -->
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./logo-192.png">
<link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Mobile Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050507;
            color: #F4F4F5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor tipo pantalla de teléfono con acabado de alta gama */
        .phone-viewport {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background: #09090B;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        @media (min-width: 480px) {
            .phone-viewport {
                height: 844px;
                border-radius: 40px;
                border: 8px solid #27272A;
            }
        }

        /* Header Minimalista */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #27272A, #18181B);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #E4E4E7;
        }

        .greeting span {
            font-size: 12px;
            color: #71717A;
            display: block;
        }

        .greeting h2 {
            font-size: 16px;
            font-weight: 600;
            color: #FAFAFA;
        }

        /* Tarjeta de Balance Principal (Estilo Black Card) */
        .balance-card {
            background: linear-gradient(145deg, #18181B 0%, #0F0F12 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .balance-card:active {
            transform: scale(0.98);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .balance-label {
            font-size: 13px;
            color: #A1A1AA;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .balance-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 14px;
            color: #F4F4F5;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-action.primary {
            background: #FAFAFA;
            color: #09090B;
        }

        .btn-action.primary:hover {
            background: #E4E4E7;
        }

        /* Sección de Transacciones Recientes */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #A1A1AA;
            margin: 24px 0 12px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tx-item {
            background: #121216;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tx-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: #E4E4E7;
            margin-bottom: 2px;
        }

        .tx-info span {
            font-size: 11px;
            color: #71717A;
        }

        .tx-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #34D399;
        }

        .tx-amount.negative {
            color: #F43F5E;
        }

        /* Indicador Home iOS inferior */
        .ios-indicator {
            width: 120px;
            height: 4px;
            background: #3F3F46;
            border-radius: 2px;
            margin: 20px auto 0 auto;
        }
    </style>
</head>
<body>

    <div class="phone-viewport">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar">RGS</div>
                <div class="greeting">
                    <span>Bienvenido de vuelta</span>
                    <h2>RGS Labs Vault</h2>
                </div>
            </div>
        </div>

        <!-- Tarjeta de Balance -->
        <div class="balance-card">
            <div class="balance-label">Balance Total Disponible</div>
            <div class="balance-amount">$142,850.40</div>
            <div class="card-actions">
                <button class="btn-action primary">Depositar</button>
                <button class="btn-action">Enviar</button>
            </div>
        </div>

        <!-- Historial / Movimientos -->
        <div>
            <div class="section-title">Actividad Reciente</div>
            <div class="tx-list">
                <div class="tx-item">
                    <div class="tx-info">
                        <h4>Stripe Payout</h4>
                        <span>Hoy, 14:20 hrs</span>
                    </div>
                    <div class="tx-amount">+$12,400.00</div>
                </div>
                <div class="tx-item">
                    <div class="tx-info">
                        <h4>Server Infrastructure</h4>
                        <span>Ayer, 09:15 hrs</span>
                    </div>
                    <div class="tx-amount negative">-$1,250.00</div>
                </div>
            </div>
        </div>

        <!-- Indicador Home iOS inferior -->
        <div class="ios-indicator"></div>
    </div>

</body>
</html>
